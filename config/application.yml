server:
# HTTP 服务配置；所有业务时间按北京时间解释和展示。
  port: 8013
  timezone: Asia/Shanghai

# 日志同时输出到控制台和文件，并按大小、份数和保留天数自动清理。
log:
  path: ./logs/newstats.log
  level: info
  max_size_mb: 100
  max_backups: 30
  max_age_days: 30
  compress: true

# MySQL 连接池与启动重试配置。
mysql:
  host: localhost
  port: 3306
  username: root
  password: ditoo_business
  database: stats
  max_open_conns: 20
  max_idle_conns: 10
  conn_max_lifetime_minutes: 30
  retry_count: 10
  retry_interval_seconds: 10

# InfluxDB 保存原始采集数据和统计历史；历史 measurement 可按环境调整。
influx:
  host: localhost
  port: 8086
  username: tolink
  password: "8981409"
  database: tolink
  history_measurement: StatsAcc
# 当前原始采集 measurement 固定取统计器 gatewayID；该字段保留配置兼容。
  raw_measurement_from_gateway: true
  precision: ns
  retry_count: 10
  retry_interval_seconds: 10

# 采集云接口用于导入导出时校验网关和测点。
cjy:
  base_url: localhost:83
  username: ditoo
  password: ditoo_password

# 统计调度与批处理配置。
stats:
  enable: true
  # 全量实时调度间隔；一轮尚未结束时不会并发启动下一轮。
  interval_seconds: 300
  # 独立逐统计器立即执行入口的并发上限，常规定时任务使用网关批处理。
  max_concurrency: 20
  # 深历史补算工作器数量，仅在服务启动时读取，修改后需要重启。
  backfill_concurrency: 5
  # 启动后立即检查历史缺口；关闭时等待首个定时周期。
  catch_up_on_start: true
  # 单个统计器单轮最多补算的闭合周期数。
  catch_up_batch_size: 200
  # 周期结束后等待采集数据到达的缓冲秒数。
  settle_delay_seconds: 30
  # InfluxDB 统计查询和写入超时。
  query_timeout_seconds: 15
  write_timeout_seconds: 15
  # 单次 InfluxQL 中包含的测点 ID 上限。
  source_id_batch_size: 300
  # MySQL 状态 Upsert 和 InfluxDB 历史写入的拆批大小。
  state_upsert_batch_size: 500
  history_write_batch_size: 2000
  # 查询成功但整周期无采集数据时写 0；查询失败时不写 0、不推进游标。
  write_zero_when_period_no_data: true
  # 当前实时接口无数据固定返回 0；该字段保留配置兼容。
  realtime_zero_when_no_current_data: true
  # 累计值回退产生负增量时转换为 0。
  negative_delta_policy: zero

# 删除统计器后异步清理统计历史；原始采集数据不会被删除。
delete_task:
  enable: true
  async_history_delete: true
  worker_interval_seconds: 30
  # 历史删除并发宜保持较低，避免影响实时统计查询。
  max_concurrency: 2
  max_retry: 5
  influx_timeout_seconds: 60
  batch_size: 50

# 历史校准第一阶段：只审计，不覆盖统计历史、不修改原始采集数据。修改后重启生效。
calibration:
  # 默认关闭；旧配置没有此分组时也不会启动或创建审计表。
  enable: false
  # 必须为 true；自动修复尚未开放，false 将停用校准并记录错误。
  audit_only: true
  # 每隔多少秒扫描下一批统计器；持久化轮转，不总是从第一批开始。
  interval_seconds: 600
  # 独立工作器并发上限，建议生产初期保持 1。
  concurrency: 1
  # 一轮最多扫描的统计器配置数量，也限制本轮待执行任务数量。
  stats_batch_size: 100
  # 同网关、同范围一次最多合并的测点/任务数量，与实时批次独立。
  point_batch_size: 20
  # 校验最近几个已结束且经过等待期的周期，不包含当前未结束周期。
  recent_periods: 1
  # 周期结束后再等多少秒，尽量避开正常补算和采集延迟。
  settle_delay_seconds: 600
  # 每轮调度预算，超时停止发起新查询；在途请求受查询超时限制。
  max_task_seconds: 120
  # 独立 InfluxDB 只读客户端超时，不改变实时统计客户端。
  query_timeout_seconds: 15
  # 审计 MySQL 查询、事务及清理的超时秒数，不是统计历史写入超时。
  write_timeout_seconds: 15
  # 失败后额外重试次数；0 表示不重试，失败记录保留供排查。
  retry_count: 1
  # 失败任务至少等待多少秒再尝试，同时作为待重试队列的检查间隔。
  retry_interval_seconds: 60
  # 连续多少批发生错误后暂停本模块；不影响原统计调度。
  pause_after_consecutive_errors: 3
  # 出错暂停秒数，暂停状态持久化，重启不会立即冲击数据库。
  error_pause_seconds: 600
  # 已完成/失效审计记录保留天数；待处理和失败记录不自动删除。
  audit_retention_days: 90
